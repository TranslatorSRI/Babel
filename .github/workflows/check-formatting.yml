name: 'Check formatting of repository files'
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-formatting-with-ruff:
    name: Check Python formatting with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version-file so CI runs the ruff in uv.lock. Without it the action installs the latest
      # release, so a ruff that nobody has locally can fail this job on a PR that did not touch
      # any Python -- 0.16 did exactly that by adding Markdown formatting. ruff is a standalone
      # binary, so no setup-python step is needed.
      #
      # Pinned to an exact version because ruff-action publishes immutable releases from v4 on:
      # there is no moving `v4` tag to track, and `@v4` fails to resolve.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "check --output-format github"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "format --check"

  check-formatting-with-snakefmt:
    name: Check Snakemake formatting with snakefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      # --no-project: snakefmt does not need babel-pipeline installed, and a plain `uv run` here
      # would sync the project, which since the maturin swap means invoking cargo. That left a lint
      # job depending on the runner image happening to ship a Rust toolchain.
      - run: uv run --no-project --with snakefmt snakefmt --check --compact-diff .

  check-formatting-with-cargo:
    name: Check Rust formatting, lints and unit tests with cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0 # pinned; keep in sync with rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

  check-formatting-with-rumdl:
    name: Check Markdown formatting with rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0 # v0 = latest stable
        with:
          report-type: annotations
