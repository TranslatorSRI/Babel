name: 'Check formatting of repository files'
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-formatting-with-ruff:
    name: Check Python formatting with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version-file so CI runs the ruff in uv.lock. Without it the action installs the latest
      # release, so a ruff that nobody has locally can fail this job on a PR that did not touch
      # any Python -- 0.16 did exactly that by adding Markdown formatting. ruff is a standalone
      # binary, so no setup-python step is needed.
      #
      # Pinned to an exact version because ruff-action publishes immutable releases from v4 on:
      # there is no moving `v4` tag to track, and `@v4` fails to resolve.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "check --output-format github"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "format --check"

  check-formatting-with-snakefmt:
    name: Check Snakemake formatting with snakefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      - run: uv run snakefmt --check --compact-diff .

  check-formatting-with-rumdl:
    name: Check Markdown formatting with rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          # Pinned; keep in sync with uv.lock. The action defaults to the latest release, so an
          # unpinned job lints with a rumdl nobody has locally: 0.2.50 started applying MD013 to
          # list-continuation lines, failing a PR that `uv run rumdl check .` passed on 0.2.45.
          # (Same failure mode the ruff job's version-file pin above exists to prevent; this
          # action has no version-file input, so the version is repeated here.)
          version: 0.2.77
          report-type: annotations
